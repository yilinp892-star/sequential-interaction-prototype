<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sign and Seal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: fixed 900×640 desk stage scaled to fit; letter above, open envelope below. Grayscale only. */
  :root {
    --bg: #e4e4e3;
    --ink: #1b1b1b;
    --soft: #9a9a9a;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px; box-sizing: border-box;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  #frame { width: 100%; max-width: 900px; position: relative; }
  #stage {
    position: absolute; left: 0; top: 0; width: 900px; height: 640px;
    transform-origin: 0 0; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .abs { position: absolute; left: 0; top: 0; }
  #letter { width: 260px; height: 338px; will-change: transform; z-index: 3; transform-origin: 125px 315px; }
  #letter.dragging { z-index: 6; }
  #letter .half { position: absolute; left: 0; width: 260px; overflow: hidden; }
  #topHalf { top: 0; height: 164px; transform-origin: 50% 164px; z-index: 1; }
  #botHalf { top: 164px; height: 174px; z-index: 2; }
  #botHalf .inner { position: absolute; left: 0; top: -164px; width: 260px; height: 338px; }
  #letter svg, #letter canvas { position: absolute; left: 0; top: 0; width: 260px; height: 338px; }
  #topBack { position: absolute; left: 13px; top: 13px; width: 224px; height: 151px; background: #dedede; border: 1.5px solid #8a8a8a; box-sizing: border-box; display: none; }
  #signZone { position: absolute; left: 13px; top: 180px; width: 224px; height: 135px; cursor: crosshair; z-index: 5; }
  #grabZone { position: absolute; left: 13px; top: 164px; width: 224px; height: 151px; cursor: grab; display: none; z-index: 5; }
  #letter.dragging #grabZone { cursor: grabbing; }
  #envInside { left: 294px; top: 330px; width: 312px; height: 312px; z-index: 2; pointer-events: none; transform-origin: 50% 131px; }
  #envFront { left: 294px; top: 330px; width: 312px; height: 312px; z-index: 4; transform-origin: 50% 100%; }
  #flap { left: 312px; top: 356px; width: 276px; height: 104px; z-index: 1; transform-origin: 50% 100%; will-change: transform; }
  #flap svg { width: 276px; height: 104px; display: block; }
  #flap.closed { z-index: 5; }
  #pressZone { left: 294px; top: 350px; width: 312px; height: 250px; z-index: 7; display: none; cursor: pointer; }
  #seal { left: 436px; top: 540px; width: 28px; height: 28px; z-index: 8; opacity: 0; pointer-events: none; transform: scale(1.4); transition: opacity .2s ease, transform .35s cubic-bezier(.3,1.6,.5,1); }
  #seal.on { opacity: 1; transform: scale(1); }
  #touch {
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(40,40,40,.16); border: 1.5px solid rgba(40,40,40,.38);
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    opacity: 0; transition: opacity .35s ease; pointer-events: none; z-index: 20;
  }
  #reset {
    position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 50%;
    border: 1.5px solid var(--soft); background: var(--bg); color: var(--ink);
    cursor: pointer; display: grid; place-items: center; z-index: 50;
  }
  #reset:hover { background: #d8d8d7; }
  #reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #reset svg { width: 18px; height: 18px; }
</style>

<div id="frame">
  <div id="stage">
    <div id="flap" class="abs">
      <svg viewBox="14 20 212 80" xmlns="http://www.w3.org/2000/svg">
        <path id="flapShape" d="M14 100 L120 20 L226 100 Z" fill="#cfcfcf" stroke="#6e6e6e" stroke-width="1.5" stroke-linejoin="round"/>
        <path id="flapGum" d="M30 98 L120 31 L210 98" fill="none" stroke="#bdbdbd" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <svg id="envInside" class="abs" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 101 L224 101 L210 116 L30 116 Z" fill="#4e4e4e"/>
    </svg>
    <div id="letter" class="abs">
      <div id="topHalf" class="half">
        <svg id="topFront" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="topBack"></div>
      </div>
      <div id="botHalf" class="half">
        <div class="inner">
          <svg id="botFront" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg"></svg>
          <canvas id="demoInk" width="520" height="676"></canvas>
          <canvas id="ink" width="520" height="676"></canvas>
        </div>
      </div>
      <div id="signZone"></div>
      <div id="grabZone"></div>
    </div>
    <svg id="envFront" class="abs" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 101 L16 101 L30 116 L210 116 L224 101 L226 101 L226 220 L14 220 Z" fill="#e2e2e2" stroke="#6e6e6e" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M14 220 L120 150 L226 220" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
      <path d="M14 101 L96 168 M226 101 L144 168" fill="none" stroke="#b4b4b4" stroke-width="1"/>
      <rect x="24" y="226" width="192" height="6" rx="3" fill="#cfcfcf"/>
    </svg>
    <div id="pressZone" class="abs"></div>
    <svg id="seal" class="abs" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="12.5" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="6.5" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
    </svg>
    <div id="touch" class="abs"></div>
    <button id="reset" aria-label="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  const W = 900, H = 640;
  const LETTER_SVG = `<rect x="14" y="16" width="172" height="232" fill="#bdbdbd" rx="2"/>
    <rect x="10" y="10" width="172" height="232" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.5" rx="2"/>
    <g fill="#8c8c8c"><rect x="26" y="34" width="120" height="4"/><rect x="26" y="50" width="138" height="4"/><rect x="26" y="66" width="130" height="4"/><rect x="26" y="82" width="142" height="4"/><rect x="26" y="98" width="96" height="4"/><rect x="26" y="122" width="134" height="4"/><rect x="26" y="138" width="110" height="4"/><rect x="26" y="154" width="70" height="4"/></g>
    <line x1="70" y1="214" x2="166" y2="214" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle id="inkDot" cx="70" cy="214" r="3" fill="#2a2a2a"/>`;
  const SIGN_Y = 278, SIGN_X0 = 91, SIGN_X1 = 216;      // signature line inside the letter
  const HOME = { x: 320, y: 18 };
  const MOUTH = { x: 450, y: 470 };                     // envelope opening
  const ALIGN = { x: MOUTH.x - 125, y: MOUTH.y - 315 }; // letter position with its folded bottom at the opening
  const SIGN_MIN = 110;

  const frame = document.getElementById('frame');
  const stage = document.getElementById('stage');
  const letter = document.getElementById('letter');
  const topHalf = document.getElementById('topHalf');
  const topFront = document.getElementById('topFront');
  const topBack = document.getElementById('topBack');
  const botFront = document.getElementById('botFront');
  const inkCv = document.getElementById('ink');
  const demoCv = document.getElementById('demoInk');
  const ink = inkCv.getContext('2d'); ink.scale(2, 2);
  const dink = demoCv.getContext('2d'); dink.scale(2, 2);
  const signZone = document.getElementById('signZone');
  const grabZone = document.getElementById('grabZone');
  const flap = document.getElementById('flap');
  const flapShape = document.getElementById('flapShape');
  const flapGum = document.getElementById('flapGum');
  const envInside = document.getElementById('envInside');
  const envFront = document.getElementById('envFront');
  const pressZone = document.getElementById('pressZone');
  const seal = document.getElementById('seal');
  const touch = document.getElementById('touch');

  let scale = 1;
  function fit() {
    scale = Math.min(1, frame.clientWidth / W);
    stage.style.transform = `scale(${scale})`;
    frame.style.height = (H * scale) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  function toStage(e) {
    const r = stage.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }

  // ---------- sound ----------
  let ac = null, noise = null, scratchGain = null, scratchAt = 0;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      noise = b;
      const src = ac.createBufferSource(); src.buffer = b; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = .8;
      scratchGain = ac.createGain(); scratchGain.gain.value = 0;
      src.connect(f).connect(scratchGain).connect(ac.destination); src.start();
    } catch (e) { ac = null; }
  }
  function burst(type, freq, vol, dur, q = 1) {
    if (!ac) return;
    try {
      const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      s.connect(f).connect(g).connect(ac.destination); s.start(t, Math.random()); s.stop(t + dur + .02);
    } catch (e) {}
  }
  function crackle(n = 6, spread = .25) {     // a sticky peel: a handful of tiny clicks
    for (let i = 0; i < n; i++) setTimeout(() => burst('highpass', 2500 + Math.random() * 2500, .05 + Math.random() * .05, .015), Math.random() * spread * 1000);
  }
  function scratch(speed) {
    if (!ac || !scratchGain) return;
    scratchGain.gain.setTargetAtTime(Math.min(speed / 10, 1) * .05, ac.currentTime, .02);
    scratchAt = performance.now();
  }

  // ---------- state ----------
  let phase, sig, pen, penTarget, drawing, strokeLen, foldAt, foldAngle, lx, ly, ltx, lty, drag, flapAngle, flapTarget, press, sealed, liftY, userActed, demo, demoNext, lastActivity, insertT, fadeT;
  function init() {
    topFront.innerHTML = LETTER_SVG; botFront.innerHTML = LETTER_SVG.replace('id="inkDot"', '');
    ink.clearRect(0, 0, 260, 338); dink.clearRect(0, 0, 260, 338); inkCv.style.opacity = 1;
    phase = 'sign'; sig = 0; pen = null; penTarget = null; drawing = false; strokeLen = 0; foldAt = 0; fadeT = 0;
    foldAngle = 0; lx = HOME.x; ly = HOME.y; ltx = lx; lty = ly; drag = null; liftY = 0;
    flapAngle = 0; flapTarget = 0; press = null; sealed = false; insertT = 0;
    letter.classList.remove('dragging'); letter.style.zIndex = ''; letter.style.opacity = 1; lsc = 1;
    flap.classList.remove('closed');
    signZone.style.display = ''; grabZone.style.display = 'none'; pressZone.style.display = 'none';
    seal.classList.remove('on');
    envFront.style.transform = ''; envInside.style.transform = '';
    flapShape.setAttribute('fill', '#cfcfcf'); flapGum.setAttribute('stroke', '#bdbdbd');
    userActed = { sign: false, drag: false, press: false };
    demo = null; demoNext = performance.now() + 1500; lastActivity = performance.now();
    touch.style.opacity = 0;
  }

  // ---------- 1. sign ----------
  function letterLocal(p) { return { x: p.x - lx, y: p.y - (ly + liftY) }; }
  signZone.addEventListener('pointerdown', (e) => {
    if (phase !== 'sign') return;
    e.preventDefault(); initAudio();
    userActed.sign = true; stopDemo();
    const p = letterLocal(toStage(e));
    drawing = true; foldAt = 0; fadeT = 0; inkCv.style.opacity = 1;
    pen = { x: p.x, y: p.y }; penTarget = { x: p.x, y: p.y };
    // the ink spreads where the nib lands
    spreadDot(p.x, p.y);
    burst('lowpass', 900, .05, .04);
  });
  function spreadDot(x, y) {
    let r = 0;
    (function grow() {
      r += .5;
      ink.fillStyle = 'rgba(25,25,25,.35)';
      ink.beginPath(); ink.arc(x, y, r, 0, Math.PI * 2); ink.fill();
      if (r < 3.2) requestAnimationFrame(grow);
    })();
  }

  window.addEventListener('pointermove', (e) => {
    lastActivity = performance.now();
    const p = toStage(e);
    if (drawing) { const q = letterLocal(p); penTarget = { x: q.x, y: q.y }; }
    if (drag) {
      if (!drag.peeled) {
        if (Math.hypot(p.x - drag.sx, p.y - drag.sy) < 7) return;   // it clings for a moment before it lets go
        drag.peeled = true; crackle(4, .12);
      }
      ltx = p.x - drag.ox; lty = p.y - drag.oy;
    }
  });
  window.addEventListener('pointerup', () => {
    if (drawing) {
      drawing = false;
      if (scratchGain) scratchGain.gain.setTargetAtTime(0, ac.currentTime, .03);
      foldAt = performance.now() + 750;               // wait a moment for another stroke
    }
    if (drag) endDrag();
    if (press) endPress();
  });

  function drawInk() {
    if (!drawing || !pen) return;
    const before = { x: pen.x, y: pen.y };
    pen.x += (penTarget.x - pen.x) * .3;               // the nib drags a little behind the hand
    pen.y += (penTarget.y - pen.y) * .3;
    const d = Math.hypot(pen.x - before.x, pen.y - before.y);
    scratch(d);
    if (d < .25) {
      // resting: ink pools and spreads
      ink.fillStyle = 'rgba(25,25,25,.05)';
      ink.beginPath(); ink.arc(pen.x, pen.y, 2 + Math.random() * 3.5, 0, Math.PI * 2); ink.fill();
      return;
    }
    strokeLen += d; sig += d;
    if (d > 6 && Math.random() < .35) return;           // fast strokes skip and break
    const w = Math.max(.7, Math.min(4.2, 4.6 - d * .55));
    ink.strokeStyle = 'rgba(22,22,22,.92)'; ink.lineWidth = w; ink.lineCap = 'round'; ink.lineJoin = 'round';
    ink.beginPath(); ink.moveTo(before.x, before.y); ink.lineTo(pen.x, pen.y); ink.stroke();
  }

  function checkSignature(now) {
    if (phase !== 'sign' || drawing || !foldAt || now < foldAt) return;
    foldAt = 0;
    if (sig >= SIGN_MIN) fold();
    else {
      // too short: it fades away
      inkCv.style.transition = 'opacity .7s ease'; inkCv.style.opacity = 0;
      setTimeout(() => { if (phase === 'sign' && !drawing) { ink.clearRect(0, 0, 260, 338); sig = 0; inkCv.style.transition = ''; inkCv.style.opacity = 1; } }, 750);
    }
  }

  // ---------- 2. fold ----------
  function fold() {
    phase = 'folding';
    signZone.style.display = 'none';
    burst('bandpass', 1800, .12, .25, .6); crackle(5, .3);
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / 650);
      foldAngle = 180 * (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
      if (k < 1) requestAnimationFrame(step);
      else { phase = 'carry'; grabZone.style.display = 'block'; burst('lowpass', 600, .2, .08); lastActivity = performance.now(); }
    })(t0);
  }

  // ---------- 3. carry into the envelope ----------
  grabZone.addEventListener('pointerdown', (e) => {
    if (phase !== 'carry') return;
    e.preventDefault(); initAudio();
    userActed.drag = true; stopDemo();
    const p = toStage(e);
    drag = { sx: p.x, sy: p.y, ox: p.x - lx, oy: p.y - ly, peeled: false };
    ltx = lx; lty = ly;
    letter.classList.add('dragging');
  });
  function mouthDist() { return Math.hypot(lx + 125 - MOUTH.x, ly + 315 - MOUTH.y); }
  function endDrag() {
    const near = mouthDist() < 85;
    drag = null;
    letter.classList.remove('dragging');
    if (near) insert();
    else { phase = 'peelback'; burst('highpass', 1800, .04, .2); }
  }
  function insert() {
    phase = 'inserting';
    grabZone.style.display = 'none';
    letter.style.zIndex = 3;
    insertT = performance.now();
    crackle(5, .35);
  }

  // ---------- 4. press the flap ----------
  pressZone.addEventListener('pointerdown', (e) => {
    if (phase !== 'seal') return;
    e.preventDefault(); initAudio();
    userActed.press = true; stopDemo();
    press = { t0: performance.now(), p: 0 };
    flapTarget = 180;
    burst('lowpass', 500, .15, .08);
  });
  function endPress() {
    const p = press; press = null;
    if (!p || sealed) return;
    // pressed too briefly: the flap peels open again
    flapTarget = 0; crackle(6, .8);
    flapShape.setAttribute('fill', '#cfcfcf'); flapGum.setAttribute('stroke', '#bdbdbd');
    envFront.style.transform = '';
  }

  // ---------- idle demonstrations ----------
  function stopDemo() { demo = null; touch.style.opacity = 0; dink.clearRect(0, 0, 260, 338); }
  function runDemo(now) {
    const want = phase === 'sign' && !userActed.sign && !drawing ? 'sign'
      : phase === 'carry' && !userActed.drag && !drag ? 'drag'
      : phase === 'seal' && !userActed.press && !press ? 'press' : null;
    if (!want) { if (demo) stopDemo(); return; }
    if (!demo) {
      if (now < demoNext || now - lastActivity < 900) return;
      demo = { kind: want, t0: now, last: null };
      touch.style.opacity = 1;
    }
    const t = now - demo.t0;
    const ease = k => 1 - Math.pow(1 - Math.max(0, Math.min(1, k)), 3);
    if (demo.kind === 'sign') {
      // a fingertip writes a faint scribble along the line, which then fades
      const k = Math.min(1, t / 1500);
      const x = SIGN_X0 + 6 + k * 105;
      const y = SIGN_Y - 9 + Math.sin(k * Math.PI * 7) * 7 * (1 - k * .4);
      if (t < 1500) {
        if (demo.last) {
          dink.strokeStyle = 'rgba(80,80,80,.35)'; dink.lineWidth = 1.6; dink.lineCap = 'round';
          dink.beginPath(); dink.moveTo(demo.last.x, demo.last.y); dink.lineTo(x, y); dink.stroke();
        }
        demo.last = { x, y };
        touch.style.transform = `translate(${lx + x - 11}px, ${ly + liftY + y - 11}px)`;
      } else if (t < 2300) {
        touch.style.opacity = 0;
        demoCv.style.opacity = (1 - (t - 1500) / 800).toFixed(2);
      } else { dink.clearRect(0, 0, 260, 338); demoCv.style.opacity = 1; demo = null; demoNext = now + 2200; }
    } else if (demo.kind === 'drag') {
      // a fingertip pulls the folded letter toward the envelope, and it clings back
      let dy = 0, press = 1;
      if (t < 400) {}
      else if (t < 600) press = .82;
      else if (t < 1300) { press = .82; dy = 70 * ease((t - 600) / 700); }
      else if (t < 1800) { press = .82; dy = 70; touch.style.opacity = 0; }
      else { demo = null; demoNext = now + 2600; ltx = HOME.x; lty = HOME.y; return; }
      lty = HOME.y + (t < 1300 ? dy * .7 : 0); ltx = HOME.x;
      touch.style.transform = `translate(${HOME.x + 125 - 11}px, ${HOME.y + 240 + dy - 11}px) scale(${press})`;
    } else if (demo.kind === 'press') {
      // a fingertip presses the flap, then lets go too soon, and it lifts open
      let press = 1;
      if (t < 400) flapTarget = 0;
      else if (t < 1200) { press = .8; flapTarget = 150; }
      else if (t < 1700) { press = .8; flapTarget = 0; touch.style.opacity = 0; }
      else { demo = null; demoNext = now + 2600; return; }
      touch.style.transform = `translate(${MOUTH.x - 11}px, ${MOUTH.y + 30 - 11}px) scale(${press})`;
    }
  }

  // ---------- frame loop ----------
  let lsc = 1;
  function loop() {
    const now = performance.now();
    if (ac && scratchGain && now - scratchAt > 60) scratchGain.gain.setTargetAtTime(0, ac.currentTime, .04);
    drawInk();
    checkSignature(now);
    runDemo(now);

    // letter position
    if (phase === 'carry') {
      if (drag && drag.peeled) {
        let tx = ltx, ty = lty;
        const d = mouthDist();
        if (d < 160) { const m = Math.pow(1 - d / 160, 2) * .8; tx += (ALIGN.x - tx) * m; ty += (ALIGN.y - ty) * m; }
        lx += (tx - lx) * .12; ly += (ty - ly) * .12;   // heavier than the cursor, as if slightly stuck
      } else if (!drag) {
        lx += (ltx - lx) * .08; ly += (lty - ly) * .08;
      }
      liftY += (-6 - liftY) * .1;                       // a folded letter sits lifted, ready to carry
    } else if (phase === 'peelback') {
      lx += (HOME.x - lx) * .05; ly += (HOME.y - ly) * .05;  // peels slowly back
      if (Math.hypot(HOME.x - lx, HOME.y - ly) < .6) { lx = HOME.x; ly = HOME.y; ltx = lx; lty = ly; phase = 'carry'; }
    } else if (phase === 'inserting') {
      const k = Math.min(1, (now - insertT) / 700);
      const e = k < .35 ? k * .6 : .21 + (k - .35) / .65 * .79;   // catches at the lip, then slides in
      lx += (ALIGN.x - lx) * .3;
      ly = ALIGN.y + 141 * e;
      liftY += (0 - liftY) * .2;
      if (k >= 1) {
        phase = 'seal'; pressZone.style.display = 'block'; lastActivity = now;
        burst('lowpass', 400, .18, .1);
        envFront.style.transform = 'scaleY(1.015)';
      }
    }
    const opening = phase === 'carry' && drag ? Math.max(0, 1 - mouthDist() / 260) : 0;
    envInside.style.transform = `scaleY(${(1 + opening * .8).toFixed(3)})`;

    const sTarget = (phase === 'sign' || phase === 'folding') ? 1 : .82;   // the folded letter shrinks to fit the envelope
    lsc += (sTarget - lsc) * .12;
    letter.style.transform = `translate(${lx.toFixed(2)}px, ${(ly + liftY).toFixed(2)}px) rotate(${drag && drag.peeled ? ((ltx - lx) * .02).toFixed(2) : 0}deg) scale(${lsc.toFixed(3)})`;
    letter.style.filter = phase === 'carry' ? `drop-shadow(0 ${drag ? 10 : 4}px ${drag ? 12 : 6}px rgba(0,0,0,.18))` : '';

    // fold
    topHalf.style.transform = `perspective(900px) rotateX(${-foldAngle}deg)`;
    const back = foldAngle > 90;
    topFront.style.display = back ? 'none' : '';
    topBack.style.display = back ? 'block' : 'none';

    // flap
    let fa = flapTarget;
    if (phase === 'carry') fa = -opening * 18;                    // the flap opens wider as the letter approaches
    if (phase === 'seal' && !press && !userActed.press && !demo) fa = Math.sin(now / 90) * 3 * (Math.sin(now / 700) > .3 ? 1 : 0); // trembles, inviting a press
    const rate = fa > flapAngle ? .3 : .045;                     // closes quickly, peels open slowly
    flapAngle += (fa - flapAngle) * rate;
    flap.style.transform = `perspective(700px) rotateX(${(-flapAngle).toFixed(2)}deg)`;
    flap.classList.toggle('closed', flapAngle > 90);

    // holding the flap down: it sticks more the longer it is held
    if (press && !sealed && flapAngle > 150) {
      press.p = Math.min(1, press.p + 1 / 28);
      const g = Math.round(207 - 60 * press.p);
      flapShape.setAttribute('fill', `rgb(${g},${g},${g})`);
      flapGum.setAttribute('stroke', `rgb(${Math.round(189 - 110 * press.p)},${Math.round(189 - 110 * press.p)},${Math.round(189 - 110 * press.p)})`);
      envFront.style.transform = `scaleY(${(1.015 - .03 * press.p).toFixed(3)})`;
      if (Math.random() < .08) crackle(1, 0);
      if (press.p >= 1) {
        sealed = true; phase = 'done';
        burst('lowpass', 300, .3, .14);
        seal.classList.add('on');
        envFront.style.transition = 'transform .4s cubic-bezier(.3,1.8,.5,1)';
        envFront.style.transform = 'scaleY(1)';
        setTimeout(() => { envFront.style.transition = ''; }, 450);
        pressZone.style.display = 'none';
      }
    }

    requestAnimationFrame(loop);
  }

  document.getElementById('reset').addEventListener('click', init);
  init();
  requestAnimationFrame(loop);
})();
</script>

</body></html>
